<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#2196f3" />
    <meta
      name="description"
      content="Escolha uma aventura e aprenda a cuidar da natureza com o Theo."
    />
    <title>Jogos • Planeta em Jogo</title>
    <link rel="icon" href="assets/icone.png" type="image/png" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="css/pages.css" />
    <link rel="stylesheet" href="css/pipes.css" />
  </head>
  <body class="games-page">
    <div class="home-scene" aria-hidden="true">
      <div class="home-sun"></div>
      <div class="cloud c1"></div>
      <div class="cloud c2"></div>
      <div class="cloud c3"></div>
      <div class="hill back"></div>
      <div class="hill front"></div>
    </div>
    <div class="sky-decoration" aria-hidden="true">
      <span>🌿</span><span>⭐</span><span>🌱</span><span>💧</span
      ><span>☀️</span>
    </div>

    <div id="app" class="app">
      <div id="home" class="screen">
        <header class="topbar">
          <a
            class="brand"
            href="index.html"
            aria-label="Planeta em Jogo: página inicial"
          >
            <div class="brand-mark" aria-hidden="true">🌎</div>
            <span>Planeta <b>em Jogo</b></span>
          </a>
          <a class="btn btn-sun btn-small" href="index.html">🏠 Início</a>
        </header>

        <main>
          <section id="choices" class="choices">
            <div class="section-heading">
              <div>
                <div class="eyebrow">ESCOLHA SUA AVENTURA</div>
                <h2>Qual missão vamos jogar? 🌟</h2>
              </div>
              <p>Você pode jogar em qualquer ordem!</p>
            </div>
            <div class="game-grid" id="game-grid"></div>
          </section>
        </main>

        <footer>
          Feito com carinho para aprender a cuidar do nosso planeta 🌍
        </footer>
      </div>

      <div id="game-screen" class="screen hidden">
        <header class="game-topbar">
          <button
            class="icon-btn"
            id="back-btn"
            type="button"
            aria-label="Voltar ao menu"
          >
            ←
          </button>
          <div class="game-heading">
            <span id="game-icon" aria-hidden="true">🌱</span>
            <div>
              <div class="game-kicker">AVENTURA DO THEO</div>
              <h1 id="game-title"></h1>
            </div>
          </div>
          <button
            class="btn btn-outline btn-small"
            id="restart-btn"
            type="button"
          >
            ↻ Reiniciar
          </button>
        </header>
        <main class="game-main">
          <div class="game-tip" id="game-tip" role="note"></div>
          <div id="game-area" class="game-area"></div>
        </main>
      </div>
    </div>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
